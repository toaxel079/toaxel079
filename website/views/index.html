<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generator - Verification System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #timer {
            font-size: 3em;
            color: #667eea;
            margin: 30px 0;
            font-weight: bold;
        }

        #keyDisplay {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            display: none;
        }

        .key-code {
            font-family: 'Courier New', monospace;
            font-size: 1.5em;
            color: #333;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 2px dashed #667eea;
            margin: 15px 0;
            word-break: break-all;
        }

        .success-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .copy-btn {
            background: #28a745;
            padding: 10px 25px;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .ad-container {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .ad-text {
            color: #856404;
            font-weight: 600;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Key Generator</h1>
        <p>Generate your unique verification key to access exclusive content on our Discord server.</p>
        
        <button id="generateBtn" onclick="generateKey()">Generate Key</button>
        
        <div class="ad-container" id="adContainer">
            <div class="ad-text">⏳ Please wait while we generate your key...</div>
            <div id="timer"></div>
        </div>

        <div id="keyDisplay">
            <div class="success-icon">✅</div>
            <h2>Your Verification Key</h2>
            <div class="key-code" id="keyCode"></div>
            <p style="color: #666; font-size: 0.9em;">Copy this key and paste it in Discord to verify.</p>
            <button class="copy-btn" onclick="copyKey()">📋 Copy Key</button>
        </div>
    </div>

    <script>
        async function generateKey() {
            const btn = document.getElementById('generateBtn');
            const adContainer = document.getElementById('adContainer');
            const timerEl = document.getElementById('timer');
            const keyDisplay = document.getElementById('keyDisplay');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>';
            
            adContainer.style.display = 'block';

            let countdown = 5;
            timerEl.textContent = countdown;

            const interval = setInterval(() => {
                countdown--;
                timerEl.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                }
            }, 1000);

            try {
                const response = await fetch('/api/generate-key');
                const data = await response.json();

                setTimeout(() => {
                    if (data.success) {
                        adContainer.style.display = 'none';
                        keyDisplay.style.display = 'block';
                        document.getElementById('keyCode').textContent = data.key;
                        btn.style.display = 'none';
                    } else {
                        alert('Failed to generate key. Please try again.');
                        btn.disabled = false;
                        btn.textContent = 'Generate Key';
                        adContainer.style.display = 'none';
                    }
                }, 5000);

            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Generate Key';
                adContainer.style.display = 'none';
            }
        }

        function copyKey() {
            const keyText = document.getElementById('keyCode').textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }
    </script>
</body>
</html>
